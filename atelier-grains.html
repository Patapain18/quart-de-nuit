<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atelier des grains · Quart de nuit</title>
  <link rel="icon" href="./icone.svg" type="image/svg+xml">
  <meta name="description" content="Regarder un grain arriver, passer sur le bateau et s'en aller : son rideau de pluie, sa rafale sur la mer, ses éclairs, le radar, et ce qu'il fait au bateau.">
  <link rel="stylesheet" href="./src/atelier-mer.css">
  <link rel="stylesheet" href="./src/atelier-trombe.css">
  <link rel="stylesheet" href="./src/atelier-grains.css">
</head>
<body>
  <canvas id="scene" aria-label="La mer et les grains, vus depuis le voilier"></canvas>
  <p id="legende" aria-live="polite"></p>
  <aside id="panneau" aria-label="Réglages de l'atelier">
    <header>
      <h1>Atelier des grains</h1>
      <button type="button" id="replier" aria-expanded="true" aria-controls="contenu">Replier</button>
    </header>
    <div id="contenu">
      <section aria-labelledby="titre-grain">
        <h2 id="titre-grain">Le grain</h2>
        <div class="grille-boutons">
          <button type="button" id="passer">Il passe sur le bateau</button>
          <button type="button" id="cote">Il passe à côté</button>
          <button type="button" id="poser">Le poser là, immobile</button>
          <button type="button" id="eclair">Un éclair dedans</button>
        </div>
        <div class="curseur espace">
          <label for="force">Sa force</label><output for="force" id="force-texte"></output>
          <input type="range" id="force" min="0.3" max="1.15" step="0.05" value="0.9">
        </div>
        <div class="curseur">
          <label for="orage">Ses éclairs</label><output for="orage" id="orage-texte"></output>
          <input type="range" id="orage" min="0" max="1" step="0.05" value="0.8">
        </div>
        <label class="case"><input type="checkbox" id="alentour"> Les grains d'alentour (selon le temps qu'il fait)</label>
        <div class="grille-boutons">
          <button type="button" id="temps-pause" aria-pressed="false">Le temps s'arrête</button>
          <button type="button" id="temps-x1" aria-pressed="true">Il passe (×1)</button>
          <button type="button" id="temps-x4" aria-pressed="false">En accéléré (×4)</button>
        </div>
        <p class="aide" id="resume" aria-live="polite"></p>
      </section>
      <section aria-labelledby="titre-ici">
        <h2 id="titre-ici">Ce qu'il fait au bateau</h2>
        <dl id="ici"></dl>
        <div id="courbes" role="img" aria-label="La traversée : la pluie, le vent, le vent qui tourne et l'averse qu'on entend, au fil du temps"></div>
      </section>
      <section aria-labelledby="titre-radar">
        <h2 id="titre-radar">Le radar du bord</h2>
        <canvas id="radar" width="256" height="256" aria-label="L'écran du radar : les grains en orange"></canvas>
        <div class="grille-boutons espace">
          <button type="button" id="portee">Portée</button>
        </div>
      </section>
      <section aria-labelledby="titre-moment">
        <h2 id="titre-moment">Le moment</h2>
        <div id="moments" class="grille-boutons"></div>
      </section>
      <section aria-labelledby="titre-vue">
        <h2 id="titre-vue">Point de vue</h2>
        <div id="vues" class="grille-boutons"></div>
        <div class="curseur espace">
          <label for="distance">Distance du grain</label><output for="distance" id="distance-texte"></output>
          <input type="range" id="distance" min="300" max="12000" step="50" value="3000">
        </div>
        <p class="aide">Glisse sur l'image pour regarder autour de toi.</p>
      </section>
      <section aria-labelledby="titre-mesures">
        <h2 id="titre-mesures">Mesures</h2>
        <dl id="mesures"></dl>
        <div class="grille-boutons">
          <button type="button" id="mesurer">Mesurer la carte graphique</button>
          <button type="button" id="photo">Photo</button>
        </div>
        <p id="etat" class="aide" role="status"></p>
      </section>
    </div>
  </aside>
  <script type="module" src="./src/atelier-grains.js"></script>
</body>
</html>
