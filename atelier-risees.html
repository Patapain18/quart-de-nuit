<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atelier des risées · Quart de nuit</title>
  <meta name="description" content="Les risées : des taches de vent plus fort qui courent sur l'eau. Les voir venir de loin, puis sentir ce qu'elles font au bateau quand elles arrivent sur lui.">
  <link rel="stylesheet" href="./src/atelier-mer.css">
  <link rel="stylesheet" href="./src/atelier-trombe.css">
  <link rel="stylesheet" href="./src/atelier-grains.css">
  <link rel="stylesheet" href="./src/atelier-risees.css">
</head>
<body>
  <canvas id="scene" aria-label="La mer et ses risées, vues depuis le voilier"></canvas>
  <p id="legende" aria-live="polite"></p>
  <aside id="panneau" aria-label="Réglages de l'atelier">
    <header>
      <h1>Atelier des risées</h1>
      <button type="button" id="replier" aria-expanded="true" aria-controls="contenu">Replier</button>
    </header>
    <div id="contenu">
      <section aria-labelledby="titre-risees">
        <h2 id="titre-risees">Les risées</h2>
        <div class="grille-boutons">
          <button type="button" id="envoyer">Une risée sur le bateau</button>
          <button type="button" id="molle">Une molle sur le bateau</button>
        </div>
        <div class="curseur espace">
          <label for="force">Sa force (le vent en plus)</label><output for="force" id="force-texte"></output>
          <input type="range" id="force" min="0.1" max="0.5" step="0.02" value="0.3">
        </div>
        <div class="curseur">
          <label for="couverture">Combien il y en a</label><output for="couverture" id="couverture-texte"></output>
          <input type="range" id="couverture" min="0" max="2" step="0.1" value="1">
        </div>
        <label class="case"><input type="checkbox" id="visibles" checked> Les dessiner sur la mer</label>
        <div class="grille-boutons">
          <button type="button" id="temps-pause" aria-pressed="false">Le temps s'arrête</button>
          <button type="button" id="temps-x1" aria-pressed="true">Il passe</button>
        </div>
        <p class="aide" id="resume" aria-live="polite"></p>
      </section>
      <section aria-labelledby="titre-ici">
        <h2 id="titre-ici">Ce qu'elles font au bateau</h2>
        <dl id="ici"></dl>
        <div id="courbes" role="img" aria-label="Au fil du temps : le vent, la gîte, la vitesse, et l'eau froissée qu'on entend arriver"></div>
      </section>
      <section aria-labelledby="titre-carte">
        <h2 id="titre-carte">Vues d'en haut</h2>
        <canvas id="carte" width="256" height="256" aria-label="La carte des risées autour du bateau : en bleu sombre, le vent plus fort ; en clair, les molles ; le bateau au milieu, la flèche dit où va le vent"></canvas>
        <p class="aide">3 km de côté ; le bateau au milieu ; la flèche : là où va le vent.</p>
      </section>
      <section aria-labelledby="titre-moment">
        <h2 id="titre-moment">Le moment</h2>
        <div id="moments" class="grille-boutons"></div>
      </section>
      <section aria-labelledby="titre-allure">
        <h2 id="titre-allure">L'allure du bateau</h2>
        <div id="allures" class="grille-boutons"></div>
      </section>
      <section aria-labelledby="titre-vue">
        <h2 id="titre-vue">Point de vue</h2>
        <div id="vues" class="grille-boutons"></div>
        <p class="aide">Glisse sur l'image pour regarder autour de toi.</p>
      </section>
      <section aria-labelledby="titre-mesures">
        <h2 id="titre-mesures">Mesures</h2>
        <dl id="mesures"></dl>
        <div class="grille-boutons">
          <button type="button" id="mesurer">Mesurer la carte graphique</button>
          <button type="button" id="photo">Photo</button>
        </div>
        <p id="etat" class="aide" role="status"></p>
      </section>
    </div>
  </aside>
  <script type="module" src="./src/atelier-risees.js"></script>
</body>
</html>
